name: Hermes Agent Gateway

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Run duration in minutes (1-340, GitHub job cap is 360)'
        required: false
        default: '340'
        type: string
      auto_restart:
        description: 'Auto-trigger next run before exit (requires HERMES_GH_PAT or NINEROUTER_GH_PAT)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      llm_provider:
        description: 'LLM provider backend for Hermes Agent'
        required: false
        default: '9router'
        type: choice
        options:
          - '9router'
          - 'openrouter'
          - 'anthropic'
          - 'gemini'
          - 'custom'
      model:
        description: 'Default model ID (leave default or specify e.g. ag/gemini-4-hydrogen-xhigh)'
        required: false
        default: 'ag/gemini-4-hydrogen-xhigh'
        type: string
      enable_api_server:
        description: 'Expose Hermes OpenAI-compatible API server (port 8642) via tunnel'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tunnel_provider:
        description: 'Tunnel provider if enable_api_server=true'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'cloudflare-quick'
          - 'cloudflare'
          - 'ngrok'
          - 'tailscale'
      skip_browser:
        description: 'Skip Playwright Chromium install for faster boot'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: hermes-gateway
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  serve:
    name: Run Hermes Telegram Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      allow_restart: ${{ steps.eligibility.outputs.allow }}

    steps:
      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LLM_PROVIDER: ${{ inputs.llm_provider || '9router' }}
          NINEROUTER_PASSWORD: ${{ secrets.NINEROUTER_PASSWORD }}
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY }}
          HERMES_LLM_API_KEY: ${{ secrets.HERMES_LLM_API_KEY }}
          HERMES_LLM_BASE_URL: ${{ secrets.HERMES_LLM_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "Error: Secret TELEGRAM_BOT_TOKEN is not set. Run 'hermes-gh connect-telegram' locally first."
            exit 1
          fi
          case "$LLM_PROVIDER" in
            9router)
              if [ -z "${NINEROUTER_PASSWORD:-}" ]; then
                echo "Error: Secret NINEROUTER_PASSWORD is missing (needed to locate 9router-tunnel)."
                exit 1
              fi
              if [ -z "${NINEROUTER_API_KEY:-}" ] && [ -z "${HERMES_LLM_API_KEY:-}" ]; then
                echo "Error: Secret NINEROUTER_API_KEY (or HERMES_LLM_API_KEY) is missing."
                exit 1
              fi
              ;;
            openrouter)
              [ -n "${OPENROUTER_API_KEY:-}" ] || { echo "Error: Secret OPENROUTER_API_KEY is missing."; exit 1; }
              ;;
            anthropic)
              [ -n "${ANTHROPIC_API_KEY:-}" ] || { echo "Error: Secret ANTHROPIC_API_KEY is missing."; exit 1; }
              ;;
            gemini)
              [ -n "${GEMINI_API_KEY:-}" ] || { echo "Error: Secret GEMINI_API_KEY is missing."; exit 1; }
              ;;
            custom)
              [ -n "${HERMES_LLM_BASE_URL:-}" ] || { echo "Error: Secret HERMES_LLM_BASE_URL is missing."; exit 1; }
              ;;
          esac
          echo "Secrets validation passed (provider=$LLM_PROVIDER)."

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-hermes-${{ runner.os }}

      - name: Install Hermes Agent
        env:
          SKIP_BROWSER: ${{ inputs.skip_browser || 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh" \
            -o /tmp/hermes-install.sh
          chmod +x /tmp/hermes-install.sh
          EXTRA_FLAGS=()
          if [ "$SKIP_BROWSER" != "false" ]; then
            EXTRA_FLAGS+=(--skip-browser)
          fi
          bash /tmp/hermes-install.sh \
            --dir "$HOME/.local/share/hermes-agent" \
            --non-interactive \
            --skip-computer-use \
            "${EXTRA_FLAGS[@]}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version

      - name: Restore encrypted Hermes state
        env:
          GH_REPO: ${{ github.repository }}
          GH_PAT: ${{ secrets.HERMES_GH_PAT || secrets.NINEROUTER_GH_PAT || secrets.GITHUB_TOKEN }}
          HERMES_STATE_PASSWORD: ${{ secrets.HERMES_STATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.hermes"
          chmod 700 "$HOME/.hermes"
          if [ -z "${HERMES_STATE_PASSWORD:-}" ]; then
            echo "HERMES_STATE_PASSWORD is not set; starting with fresh state."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_PAT"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def api_get(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "User-Agent": "hermes-gh/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          runs = api_get("/actions/workflows/hermes.yml/runs?per_page=15").get("workflow_runs", [])
          target_artifact = None
          for r in runs:
              if r.get("status") != "completed":
                  continue
              arts = api_get(f"/actions/runs/{r['id']}/artifacts").get("artifacts", [])
              for a in arts:
                  if a.get("name") == "hermes-state-enc" and not a.get("expired"):
                      target_artifact = a
                      break
              if target_artifact:
                  break

          if not target_artifact:
              print("No previous hermes-state-enc artifact found; starting clean.")
              raise SystemExit(0)

          dl_url = target_artifact["archive_download_url"]
          req = urllib.request.Request(
              dl_url,
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "User-Agent": "hermes-gh/1.0"},
          )
          zip_path = Path("/tmp/hermes-state.zip")
          try:
              with opener.open(req, timeout=30) as resp, zip_path.open("wb") as out_f:
                  shutil.copyfileobj(resp, out_f, 65536)
          except urllib.error.HTTPError as exc:
              if exc.code in (301, 302, 303, 307, 308) and exc.headers.get("Location"):
                  loc = exc.headers["Location"]
                  with urllib.request.urlopen(urllib.request.Request(loc, headers={"User-Agent": "hermes-gh/1.0"}), timeout=120) as r2, zip_path.open("wb") as out_f:
                      shutil.copyfileobj(r2, out_f, 65536)
              else:
                  raise
          with zipfile.ZipFile(zip_path, "r") as zf:
              zf.extractall("/tmp/hermes-state-in")
          zip_path.unlink(missing_ok=True)
          print(f"Downloaded encrypted state artifact (size={target_artifact.get('size_in_bytes')} bytes).")
          PY
          if [ -f /tmp/hermes-state-in/hermes-state.tar.gz.enc ]; then
            PW="$HERMES_STATE_PASSWORD" node -e '
              const fs = require("fs");
              const c = require("crypto");
              const buf = fs.readFileSync("/tmp/hermes-state-in/hermes-state.tar.gz.enc");
              if (buf.length < 48 || buf.subarray(0, 4).toString("ascii") !== "HRM1") {
                console.error("Invalid encrypted state header.");
                process.exit(2);
              }
              const salt = buf.subarray(4, 20);
              const iv = buf.subarray(20, 32);
              const tag = buf.subarray(32, 48);
              const ct = buf.subarray(48);
              const key = c.scryptSync(process.env.PW, salt, 32);
              const dec = c.createDecipheriv("aes-256-gcm", key, iv);
              dec.setAuthTag(tag);
              const plain = Buffer.concat([dec.update(ct), dec.final()]);
              fs.writeFileSync("/tmp/hermes-state.tar.gz", plain);
            '
            tar -xzf /tmp/hermes-state.tar.gz -C "$HOME/.hermes" \
              --exclude='./tools' --exclude='./installs' --exclude='./bin' \
              --exclude='./toolchains' --exclude='./image_cache' --exclude='./audio_cache' \
              --exclude='./telemetry' --exclude='./hermes-agent' --exclude='./.env'
            rm -rf /tmp/hermes-state.tar.gz /tmp/hermes-state-in
            chmod 700 "$HOME/.hermes"
            echo "Restored encrypted Hermes state."
          fi

      - name: Configure Hermes runtime (.env and config.yaml)
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider || '9router' }}
          INPUT_MODEL: ${{ inputs.model || '' }}
          ENABLE_API_SERVER: ${{ inputs.enable_api_server || 'false' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.HERMES_GH_PAT || secrets.NINEROUTER_GH_PAT || secrets.GITHUB_TOKEN }}
          NINEROUTER_PASSWORD: ${{ secrets.NINEROUTER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY || secrets.HERMES_LLM_API_KEY }}
          HERMES_LLM_API_KEY: ${{ secrets.HERMES_LLM_API_KEY }}
          HERMES_LLM_BASE_URL: ${{ secrets.HERMES_LLM_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.HERMES_STATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.hermes"
          chmod 700 "$HOME/.hermes"

          cat <<'PY' > /tmp/resolve_9router.py
          #!/usr/bin/env python3
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request

          REPO = os.environ["GH_REPO"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          NR_PW = os.environ.get("NINEROUTER_PASSWORD", "")

          def gh_json(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  headers={"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "User-Agent": "hermes-9r-resolve/1.0"},
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def decrypt_enc1(enc_val):
              js = (
                  "const c=require('crypto');"
                  "const p=process.env.ENC_VAL.split('.');"
                  "if(p.length!==4||p[0]!=='enc1')process.exit(2);"
                  "const k=c.createHash('sha256').update(process.env.PW).digest();"
                  "const d=c.createDecipheriv('aes-256-gcm',k,Buffer.from(p[1],'base64url'));"
                  "d.setAuthTag(Buffer.from(p[2],'base64url'));"
                  "process.stdout.write(Buffer.concat([d.update(Buffer.from(p[3],'base64url')),d.final()]).toString('utf8'));"
              )
              res = subprocess.run(
                  ["node", "-e", js],
                  env={**os.environ, "ENC_VAL": enc_val, "PW": NR_PW},
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if res.returncode != 0 or not res.stdout.strip():
                  return None
              return res.stdout.strip().rstrip("/") + "/v1"

          def resolve_once():
              runs = gh_json("/actions/workflows/9router.yml/runs?per_page=5").get("workflow_runs", [])
              active = [r for r in runs if r.get("status") in ("in_progress", "queued", "waiting")]
              for r in active:
                  sha = r.get("head_sha")
                  rid = str(r.get("id", ""))
                  if not sha or not rid:
                      continue
                  crs = gh_json(f"/commits/{sha}/check-runs?check_name=9router-tunnel&per_page=20").get("check_runs", [])
                  for cr in crs:
                      if str(cr.get("external_id", "")) != rid:
                          continue
                      summary = (cr.get("output") or {}).get("summary") or ""
                      for line in summary.splitlines():
                          if line.startswith("9ROUTER_TUNNEL_ENC="):
                              v1 = decrypt_enc1(line.split("=", 1)[1].strip())
                              if v1:
                                  return v1
              return None

          def resolve_wait(wait_sec=90):
              deadline = time.time() + wait_sec
              while True:
                  try:
                      v1 = resolve_once()
                      if v1:
                          return v1
                  except Exception:
                      pass
                  if time.time() >= deadline:
                      return None
                  time.sleep(4)

          if __name__ == "__main__":
              wait_s = int(sys.argv[1]) if len(sys.argv) > 1 else 0
              url = resolve_wait(wait_s)
              if not url:
                  raise SystemExit(1)
              print(url)
          PY
          chmod 700 /tmp/resolve_9router.py

          HERMES_PY=""
          for cand in "$HOME"/.hermes/installs/*/environments/*/bin/python "$HOME/.local/share/hermes-agent/.hermes/bin/python"; do
            if [ -x "$cand" ]; then
              HERMES_PY="$cand"
              break
            fi
          done
          if [ -z "$HERMES_PY" ]; then
            HERMES_PY="python3"
          fi

          "$HERMES_PY" - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          import yaml

          hermes_dir = Path.home() / ".hermes"
          env_path = hermes_dir / ".env"
          cfg_path = hermes_dir / "config.yaml"

          env_lines = [
              "HERMES_GATEWAY_NO_SUPERVISE=1",
              "TERM=xterm-256color",
              f"TELEGRAM_BOT_TOKEN={os.environ['TELEGRAM_BOT_TOKEN'].strip()}",
          ]
          optional_env = {
              "TELEGRAM_ALLOWED_USERS": os.environ.get("TELEGRAM_ALLOWED_USERS", "").strip(),
              "TELEGRAM_HOME_CHANNEL": os.environ.get("TELEGRAM_HOME_CHANNEL", "").strip(),
              "NINEROUTER_API_KEY": os.environ.get("NINEROUTER_API_KEY", "").strip(),
              "HERMES_LLM_API_KEY": os.environ.get("HERMES_LLM_API_KEY", "").strip(),
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", "").strip(),
              "ANTHROPIC_API_KEY": os.environ.get("ANTHROPIC_API_KEY", "").strip(),
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", "").strip(),
              "OPENAI_API_KEY": os.environ.get("OPENAI_API_KEY", "").strip(),
          }
          for k, v in optional_env.items():
              if v:
                  env_lines.append(f"{k}={v}")

          if os.environ.get("ENABLE_API_SERVER") == "true":
              api_key = os.environ.get("HERMES_API_KEY", "").strip()
              env_lines.append("API_SERVER_ENABLED=true")
              env_lines.append("API_SERVER_HOST=127.0.0.1")
              env_lines.append("API_SERVER_PORT=8642")
              if api_key:
                  env_lines.append(f"API_SERVER_KEY={api_key}")

          tmp_env = hermes_dir / ".env.tmp"
          tmp_env.write_text("\n".join(env_lines) + "\n", encoding="utf-8")
          os.chmod(tmp_env, 0o600)
          tmp_env.replace(env_path)

          cfg = {}
          if cfg_path.exists():
              loaded = yaml.safe_load(cfg_path.read_text(encoding="utf-8"))
              if isinstance(loaded, dict):
                  cfg = loaded

          db_cfg = cfg.setdefault("database", {})
          if isinstance(db_cfg, dict):
              db_cfg["journal_mode"] = "wal"

          term_cfg = cfg.setdefault("terminal", {})
          if isinstance(term_cfg, dict):
              term_cfg["backend"] = "local"

          model_cfg = cfg.setdefault("model", {})
          if not isinstance(model_cfg, dict):
              model_cfg = {}
              cfg["model"] = model_cfg

          provider = os.environ.get("LLM_PROVIDER", "9router").strip().lower()
          input_model = os.environ.get("INPUT_MODEL", "").strip()
          if provider != "9router" and input_model == "ag/gemini-4-hydrogen-xhigh":
              input_model = ""

          if provider == "9router":
              res = subprocess.run(["python3", "/tmp/resolve_9router.py", "90"], capture_output=True, text=True, check=False)
              if res.returncode != 0 or not res.stdout.strip():
                  raise RuntimeError("Could not resolve active 9Router tunnel URL from 9router.yml check-runs. Ensure 9router-gh start is running.")
              direct_v1 = res.stdout.strip()
              # Verify /v1/models responds directly without printing the secret tunnel URL.
              nr_key = os.environ["NINEROUTER_API_KEY"].strip()
              mreq = urllib.request.Request(
                  f"{direct_v1}/models",
                  headers={"Authorization": f"Bearer {nr_key}", "User-Agent": "hermes-gh/1.0"},
              )
              with urllib.request.urlopen(mreq, timeout=20) as mresp:
                  if mresp.status != 200:
                      raise RuntimeError(f"9Router /v1/models returned HTTP {mresp.status}")
              model_cfg["provider"] = "custom"
              model_cfg["base_url"] = direct_v1
              model_cfg["key_env"] = "NINEROUTER_API_KEY"
              model_cfg["api_mode"] = "chat_completions"
              model_cfg["default"] = input_model or model_cfg.get("default") or "ag/gemini-4-hydrogen-xhigh"
              cfg["fallback_providers"] = [
                  {
                      "provider": "custom",
                      "base_url": direct_v1,
                      "key_env": "NINEROUTER_API_KEY",
                      "api_mode": "chat_completions",
                      "model": "ag/gemini-3.8-flash-high",
                  },
                  {
                      "provider": "custom",
                      "base_url": direct_v1,
                      "key_env": "NINEROUTER_API_KEY",
                      "api_mode": "chat_completions",
                      "model": "ag/gemini-4-argon-high",
                  },
              ]
              print("9Router direct upstream verified (status=200).")
          elif provider == "custom":
              model_cfg["provider"] = "custom"
              model_cfg["base_url"] = os.environ["HERMES_LLM_BASE_URL"].strip().rstrip("/")
              if os.environ.get("HERMES_LLM_API_KEY", "").strip():
                  model_cfg["key_env"] = "HERMES_LLM_API_KEY"
              elif os.environ.get("OPENAI_API_KEY", "").strip():
                  model_cfg["key_env"] = "OPENAI_API_KEY"
              else:
                  model_cfg.pop("key_env", None)
              model_cfg["api_mode"] = "chat_completions"
              if input_model:
                  model_cfg["default"] = input_model
          elif provider == "openrouter":
              model_cfg["provider"] = "openrouter"
              model_cfg["base_url"] = "https://openrouter.ai/api/v1"
              model_cfg.pop("key_env", None)
              model_cfg.pop("api_mode", None)
              model_cfg["default"] = input_model or model_cfg.get("default") or "anthropic/claude-sonnet-4.5"
          elif provider in ("anthropic", "gemini"):
              model_cfg["provider"] = provider
              model_cfg.pop("base_url", None)
              model_cfg.pop("key_env", None)
              model_cfg.pop("api_mode", None)
              if input_model:
                  model_cfg["default"] = input_model

          tmp_cfg = hermes_dir / "config.yaml.tmp"
          tmp_cfg.write_text(yaml.safe_dump(cfg, sort_keys=False, allow_unicode=True), encoding="utf-8")
          os.chmod(tmp_cfg, 0o600)
          tmp_cfg.replace(cfg_path)

          # Verify Telegram bot token cleanly without printing secret token.
          tg_token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tg_token}/getMe",
              headers={"User-Agent": "hermes-gh/1.0"},
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          if not data.get("ok"):
              raise RuntimeError("Telegram getMe returned ok=false")
          username = (data.get("result") or {}).get("username", "unknown")
          has_allowlist = bool(os.environ.get("TELEGRAM_ALLOWED_USERS", "").strip())
          print(f"Telegram bot verified: @{username} | allowlist_set={has_allowlist} | llm_provider={provider} | model={model_cfg.get('default')}")
          if not has_allowlist:
              print("WARNING: TELEGRAM_ALLOWED_USERS secret is empty. Run 'hermes-gh connect-telegram' to authorize your Telegram user ID.")

          # Verify Hermes runtime resolution and run a one-shot non-secret LLM smoke test.
          try:
              import sys as _sys
              from urllib.parse import urlparse as _urlparse
              hermes_repo = Path.home() / ".local" / "share" / "hermes-agent"
              if str(hermes_repo) not in _sys.path:
                  _sys.path.insert(0, str(hermes_repo))
              from hermes_cli.runtime_provider import resolve_runtime_provider
              rt = resolve_runtime_provider()
              bu = str(rt.get("base_url") or "")
              host_tail = ".".join(_urlparse(bu).netloc.split(".")[-2:]) if bu else "none"
              print(f"Hermes runtime resolved: provider={rt.get('provider')} api_mode={rt.get('api_mode')} host_suffix={host_tail} has_key={bool(rt.get('api_key'))}")
          except Exception as rtexc:
              print(f"Hermes runtime check warning: {type(rtexc).__name__}: {str(rtexc)[:200]}")
          PY
          set +e
          PROBE_OUT=$(timeout 45 "$HOME/.local/bin/hermes" chat -q "Reply with exactly: OK" 2>&1)
          PROBE_RC=$?
          set -e
          echo "Hermes chat probe rc=${PROBE_RC}"
          printf '%s\n' "$PROBE_OUT" | grep -E "HTTP|530|503|429|401|404|Error|ERROR|OK|Fallback|fallback|rate" | head -n 12 || true

      - name: Resolve and install tunnel client (if API server enabled)
        id: tunnel
        if: ${{ inputs.enable_api_server == 'true' }}
        env:
          INPUT_PROVIDER: ${{ inputs.tunnel_provider || 'auto' }}
          CF_SET: ${{ secrets.CF_TUNNEL_TOKEN != '' }}
          NGROK_SET: ${{ secrets.NGROK_AUTHTOKEN != '' }}
          TS_SET: ${{ secrets.TS_AUTHKEY != '' }}
        run: |
          set -euo pipefail
          PROVIDER="$INPUT_PROVIDER"
          if [ "$PROVIDER" = "auto" ]; then
            if [ "$CF_SET" = "true" ]; then
              PROVIDER="cloudflare"
            elif [ "$NGROK_SET" = "true" ]; then
              PROVIDER="ngrok"
            elif [ "$TS_SET" = "true" ]; then
              PROVIDER="tailscale"
            else
              PROVIDER="cloudflare-quick"
            fi
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          case "$PROVIDER" in
            cloudflare|cloudflare-quick)
              curl -fsSL --retry 3 --retry-delay 2 \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
                -o "$HOME/.local/bin/cloudflared"
              chmod +x "$HOME/.local/bin/cloudflared"
              ;;
            ngrok)
              curl -fsSL --retry 3 --retry-delay 2 \
                "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" \
                -o /tmp/ngrok.tgz
              tar -xzf /tmp/ngrok.tgz -C "$HOME/.local/bin" ngrok
              chmod +x "$HOME/.local/bin/ngrok"
              rm -f /tmp/ngrok.tgz
              ;;
            tailscale)
              curl -fsSL https://tailscale.com/install.sh | sh
              ;;
          esac

      - name: Run Hermes Gateway
        env:
          DURATION_INPUT: ${{ inputs.duration_minutes || '340' }}
          LLM_PROVIDER: ${{ inputs.llm_provider || '9router' }}
          ENABLE_API_SERVER: ${{ inputs.enable_api_server || 'false' }}
          TUNNEL_PROVIDER: ${{ steps.tunnel.outputs.provider || 'cloudflare-quick' }}
          HERMES_STATE_PASSWORD: ${{ secrets.HERMES_STATE_PASSWORD }}
          NINEROUTER_PASSWORD: ${{ secrets.NINEROUTER_PASSWORD }}
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY || secrets.HERMES_LLM_API_KEY }}
          HERMES_LLM_API_KEY: ${{ secrets.HERMES_LLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_HOSTNAME: ${{ secrets.TS_HOSTNAME }}
          GH_TOKEN: ${{ secrets.HERMES_GH_PAT || secrets.NINEROUTER_GH_PAT || secrets.GITHUB_TOKEN }}
          CHECK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          rm -f /tmp/hermes-allow-restart

          DURATION_MIN="$DURATION_INPUT"
          if ! [[ "$DURATION_MIN" =~ ^[0-9]+$ ]]; then DURATION_MIN=340; fi
          if [ "$DURATION_MIN" -lt 1 ]; then DURATION_MIN=1; fi
          if [ "$DURATION_MIN" -gt 340 ]; then DURATION_MIN=340; fi

          HERMES_PY=""
          for cand in "$HOME"/.hermes/installs/*/environments/*/bin/python "$HOME/.local/share/hermes-agent/.hermes/bin/python"; do
            if [ -x "$cand" ]; then
              HERMES_PY="$cand"
              break
            fi
          done
          if [ -z "$HERMES_PY" ]; then
            HERMES_PY="python3"
          fi

          HERMES_PID=""
          TUNNEL_PID=""
          CHECK_RUN_ID=""

          publish_encrypted_url() {
            local raw_url="$1"
            if [ -z "${HERMES_STATE_PASSWORD:-}" ]; then return 0; fi
            local enc_url
            enc_url=$(RAW_URL="$raw_url" PW="$HERMES_STATE_PASSWORD" node -e '
              const c = require("crypto");
              const key = c.createHash("sha256").update(process.env.PW).digest();
              const iv = c.randomBytes(12);
              const cipher = c.createCipheriv("aes-256-gcm", key, iv);
              const ct = Buffer.concat([cipher.update(process.env.RAW_URL, "utf8"), cipher.final()]);
              const tag = cipher.getAuthTag();
              process.stdout.write(["enc1", iv.toString("base64url"), tag.toString("base64url"), ct.toString("base64url")].join("."));
            ')
            local payload
            payload=$(ENC_LINE="HERMES_TUNNEL_ENC=${enc_url}" SHA="$GH_SHA" RID="$GH_RUN_ID" node -e '
              console.log(JSON.stringify({
                name: "hermes-tunnel",
                head_sha: process.env.SHA,
                external_id: process.env.RID,
                status: "in_progress",
                output: { title: "Hermes API Tunnel Active", summary: process.env.ENC_LINE }
              }));
            ')
            if [ -z "$CHECK_RUN_ID" ]; then
              CHECK_RUN_ID=$(curl -fsSL -X POST \
                -H "Authorization: Bearer $CHECK_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/check-runs" \
                -d "$payload" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).id||""));')
            else
              curl -fsSL -X PATCH \
                -H "Authorization: Bearer $CHECK_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/check-runs/$CHECK_RUN_ID" \
                -d "$payload" >/dev/null
            fi
            echo "Encrypted API tunnel published to check-run (id=$CHECK_RUN_ID)."
          }

          stop_hermes() {
            if [ -n "$HERMES_PID" ] && kill -0 "$HERMES_PID" 2>/dev/null; then
              kill -TERM "$HERMES_PID" >/dev/null 2>&1 || true
              for _ in $(seq 1 20); do
                kill -0 "$HERMES_PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$HERMES_PID" >/dev/null 2>&1 || true
            fi
            HERMES_PID=""
          }

          start_hermes() {
            touch /tmp/hermes-gateway.log
            chmod 600 /tmp/hermes-gateway.log
            HERMES_GATEWAY_NO_SUPERVISE=1 "$HOME/.local/bin/hermes" gateway run --replace --external-supervisor >/tmp/hermes-gateway.log 2>&1 &
            HERMES_PID=$!
            for _ in $(seq 1 10); do
              if ! kill -0 "$HERMES_PID" 2>/dev/null; then
                echo "Error: Hermes gateway exited immediately on startup."
                return 1
              fi
              sleep 1
            done
            echo "Hermes gateway started (pid=$HERMES_PID)."
          }

          sync_direct_9router() {
            if [ "$LLM_PROVIDER" != "9router" ]; then return 0; fi
            local new_url
            new_url=$(python3 /tmp/resolve_9router.py 0 2>/dev/null || true)
            if [ -z "$new_url" ]; then
              return 0
            fi
            local changed
            changed=$(NEW_URL="$new_url" "$HERMES_PY" - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg_path = Path.home() / ".hermes" / "config.yaml"
          cfg = yaml.safe_load(cfg_path.read_text(encoding="utf-8")) or {}
          model_cfg = cfg.setdefault("model", {})
          new_url = os.environ["NEW_URL"].strip()
          if model_cfg.get("base_url") != new_url:
              model_cfg["base_url"] = new_url
              fb = cfg.get("fallback_providers")
              if isinstance(fb, list):
                  for entry in fb:
                      if isinstance(entry, dict) and entry.get("key_env") == "NINEROUTER_API_KEY":
                          entry["base_url"] = new_url
              tmp = cfg_path.with_suffix(".yaml.tmp")
              tmp.write_text(yaml.safe_dump(cfg, sort_keys=False, allow_unicode=True), encoding="utf-8")
              os.chmod(tmp, 0o600)
              tmp.replace(cfg_path)
              print("changed")
          else:
              print("same")
          PY
          )
            if [ "$changed" = "changed" ]; then
              echo "[9router] Detected rotated tunnel URL; updating config and restarting Hermes gateway..."
              stop_hermes
              start_hermes
            fi
          }

          start_tunnel() {
            if [ "$ENABLE_API_SERVER" != "true" ]; then return 0; fi
            case "$TUNNEL_PROVIDER" in
              cloudflare-quick)
                rm -f /tmp/hermes-tunnel.log
                cloudflared tunnel --no-autoupdate --protocol http2 --url "http://127.0.0.1:8642" --retries 99 --logfile /tmp/hermes-tunnel.log >/dev/null 2>&1 &
                TUNNEL_PID=$!
                local qurl=""
                for _ in $(seq 1 45); do
                  kill -0 "$TUNNEL_PID" 2>/dev/null || return 1
                  if [ -f /tmp/hermes-tunnel.log ]; then
                    qurl=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/hermes-tunnel.log | grep -v '^https://api\.trycloudflare\.com$' | tail -n 1 || true)
                    [ -n "$qurl" ] && break
                  fi
                  sleep 1
                done
                [ -n "$qurl" ] && publish_encrypted_url "$qurl"
                ;;
              cloudflare)
                cloudflared tunnel --no-autoupdate --protocol http2 --logfile /tmp/hermes-tunnel.log run --token "$CF_TUNNEL_TOKEN" >/dev/null 2>&1 &
                TUNNEL_PID=$!
                ;;
              ngrok)
                ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null 2>&1
                if [ -n "${NGROK_DOMAIN:-}" ]; then
                  ngrok http "127.0.0.1:8642" --domain="$NGROK_DOMAIN" --log=/tmp/hermes-tunnel.log >/dev/null 2>&1 &
                else
                  ngrok http "127.0.0.1:8642" --log=/tmp/hermes-tunnel.log >/dev/null 2>&1 &
                fi
                TUNNEL_PID=$!
                ;;
              tailscale)
                sudo mkdir -p /var/run/tailscale
                sudo tailscaled --state=mem: --socket=/var/run/tailscale/tailscaled.sock >/tmp/tailscaled.log 2>&1 &
                TUNNEL_PID=$!
                for _ in $(seq 1 15); do
                  [ -S /var/run/tailscale/tailscaled.sock ] && break
                  sleep 1
                done
                sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="${TS_HOSTNAME:-hermes-gh}" --accept-dns=false >/dev/null 2>&1
                sudo tailscale serve --bg 8642 >/dev/null 2>&1 || true
                ;;
            esac
          }

          cleanup() {
            set +e
            if [ -n "$CHECK_RUN_ID" ]; then
              curl -fsSL -X PATCH \
                -H "Authorization: Bearer $CHECK_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/check-runs/$CHECK_RUN_ID" \
                -d '{"status":"completed","conclusion":"success","output":{"title":"Hermes Tunnel Closed","summary":"Session ended."}}' >/dev/null 2>&1 || true
            fi
            stop_hermes
            if [ -n "$TUNNEL_PID" ]; then
              if [ "$TUNNEL_PROVIDER" = "tailscale" ]; then
                sudo tailscale logout >/dev/null 2>&1 || true
                sudo kill "$TUNNEL_PID" >/dev/null 2>&1 || true
              else
                kill "$TUNNEL_PID" >/dev/null 2>&1 || true
              fi
            fi
          }
          trap cleanup EXIT INT TERM

          start_hermes
          start_tunnel
          echo "Hermes Gateway active for ${DURATION_MIN} minute(s)."

          START_TS=$(date +%s)
          END_TS=$(( START_TS + DURATION_MIN * 60 ))
          LAST_BEAT=$START_TS
          LAST_9R_CHECK=$START_TS

          while [ "$(date +%s)" -lt "$END_TS" ]; do
            sleep 15
            NOW=$(date +%s)
            if [ $(( NOW - START_TS )) -ge 120 ]; then
              touch /tmp/hermes-allow-restart
            fi
            if [ -z "$HERMES_PID" ] || ! kill -0 "$HERMES_PID" 2>/dev/null; then
              echo "[watchdog] hermes gateway exited; restarting..."
              start_hermes
            fi
            if [ "$LLM_PROVIDER" = "9router" ] && [ $(( NOW - LAST_9R_CHECK )) -ge 60 ]; then
              sync_direct_9router
              LAST_9R_CHECK=$NOW
            fi
            if [ "$ENABLE_API_SERVER" = "true" ]; then
              if [ "$TUNNEL_PROVIDER" = "tailscale" ]; then
                if ! sudo kill -0 "$TUNNEL_PID" 2>/dev/null; then
                  echo "[watchdog] tailscaled exited; restarting..."
                  start_tunnel
                fi
              elif [ -n "$TUNNEL_PID" ] && ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                echo "[watchdog] tunnel exited; restarting..."
                start_tunnel
              fi
            fi
            if [ $(( NOW - LAST_BEAT )) -ge 600 ]; then
              REM=$(( (END_TS - NOW) / 60 ))
              echo "[heartbeat] hermes=ok | llm=${LLM_PROVIDER} | remaining=${REM}m"
              LAST_BEAT=$NOW
            fi
          done

          touch /tmp/hermes-allow-restart
          echo "Configured duration (${DURATION_MIN}m) reached. Shutting down cleanly."

      - name: Save and encrypt Hermes state
        if: always()
        env:
          HERMES_STATE_PASSWORD: ${{ secrets.HERMES_STATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HERMES_STATE_PASSWORD:-}" ]; then
            echo "HERMES_STATE_PASSWORD not set; skipping state encryption."
            exit 0
          fi
          if [ ! -d "$HOME/.hermes" ]; then
            exit 0
          fi
          pkill -TERM -f "hermes.*gateway" >/dev/null 2>&1 || true
          sleep 2

          rm -rf /tmp/hermes-stage /tmp/hermes-state-out
          mkdir -p /tmp/hermes-stage /tmp/hermes-state-out

          python3 - <<'PY'
          import os
          import shutil
          import sqlite3
          from pathlib import Path

          src = Path.home() / ".hermes"
          dst = Path("/tmp/hermes-stage")

          keep_items = {
              "config.yaml", "memories", "memory", "sessions", "cron", "skills",
              "pairing", "hooks", "auth", "plugins", "SOUL.md", "USER.md", "MEMORY.md", "AGENTS.md",
          }
          for item in src.iterdir():
              name = item.name
              if name not in keep_items:
                  continue
              target = dst / name
              if item.is_dir():
                  shutil.copytree(
                      item,
                      target,
                      ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.log", "*.pid", "*.sock", "*.lock", "node_modules"),
                      dirs_exist_ok=True,
                  )
              elif item.is_file():
                  shutil.copy2(item, target)

          db_src = src / "state.db"
          if db_src.exists():
              s_conn = sqlite3.connect(str(db_src))
              d_conn = sqlite3.connect(str(dst / "state.db"))
              s_conn.backup(d_conn)
              s_conn.close()
              d_conn.close()
          PY

          tar -czf /tmp/hermes-state.tar.gz -C /tmp/hermes-stage .
          PW="$HERMES_STATE_PASSWORD" node -e '
            const fs = require("fs");
            const c = require("crypto");
            const plain = fs.readFileSync("/tmp/hermes-state.tar.gz");
            const salt = c.randomBytes(16);
            const iv = c.randomBytes(12);
            const key = c.scryptSync(process.env.PW, salt, 32);
            const cipher = c.createCipheriv("aes-256-gcm", key, iv);
            const ct = Buffer.concat([cipher.update(plain), cipher.final()]);
            const tag = cipher.getAuthTag();
            fs.writeFileSync("/tmp/hermes-state-out/hermes-state.tar.gz.enc", Buffer.concat([Buffer.from("HRM1"), salt, iv, tag, ct]));
          '
          rm -rf /tmp/hermes-stage /tmp/hermes-state.tar.gz
          echo "Encrypted Hermes state prepared ($(wc -c < /tmp/hermes-state-out/hermes-state.tar.gz.enc) bytes)."

      - name: Upload encrypted Hermes state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-state-enc
          path: /tmp/hermes-state-out/hermes-state.tar.gz.enc
          retention-days: 90
          if-no-files-found: ignore

      - name: Prune older encrypted state artifacts
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_PAT: ${{ secrets.HERMES_GH_PAT || secrets.NINEROUTER_GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_PAT"]
          cur_run = str(os.environ["GH_RUN_ID"])

          def req(path, method="GET"):
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "User-Agent": "hermes-gh/1.0"},
                  method=method,
              )
              with urllib.request.urlopen(r, timeout=15) as resp:
                  raw = resp.read().decode("utf-8")
                  return json.loads(raw) if raw.strip() else {}

          try:
              arts = req("/actions/artifacts?name=hermes-state-enc&per_page=30").get("artifacts", [])
              older = [a for a in arts if str((a.get("workflow_run") or {}).get("id", "")) != cur_run]
              older.sort(key=lambda a: a.get("created_at", ""), reverse=True)
              for a in older[3:]:
                  req(f"/actions/artifacts/{a['id']}", method="DELETE")
          except Exception as exc:
              print(f"Artifact prune skipped: {exc}")
          PY

      - name: Record restart eligibility
        id: eligibility
        if: ${{ !cancelled() }}
        run: |
          if [ -f /tmp/hermes-allow-restart ]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
          fi

  retrigger:
    name: Auto-Restart Next Hermes Session
    needs: serve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !cancelled() && needs.serve.result != 'cancelled' && needs.serve.outputs.allow_restart == 'true' && (inputs.auto_restart || 'true') != 'false' }}
    env:
      GH_PAT: ${{ secrets.HERMES_GH_PAT || secrets.NINEROUTER_GH_PAT }}
      GH_REPO: ${{ github.repository }}
      GH_REF: ${{ github.ref_name }}
      INPUT_DURATION: ${{ inputs.duration_minutes || '340' }}
      INPUT_PROVIDER: ${{ inputs.llm_provider || '9router' }}
      INPUT_MODEL: ${{ inputs.model || 'ag/gemini-4-hydrogen-xhigh' }}
      INPUT_API_SERVER: ${{ inputs.enable_api_server || 'false' }}
      INPUT_TUNNEL: ${{ inputs.tunnel_provider || 'auto' }}
      INPUT_SKIP_BROWSER: ${{ inputs.skip_browser || 'true' }}
    steps:
      - name: Wait for clean Telegram handoff and dispatch next run
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "Error: HERMES_GH_PAT / NINEROUTER_GH_PAT secret is missing; cannot auto-restart."
            exit 1
          fi
          sleep 5
          PAYLOAD=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": os.environ.get("GH_REF") or "main",
              "inputs": {
                  "duration_minutes": os.environ.get("INPUT_DURATION") or "340",
                  "auto_restart": "true",
                  "llm_provider": os.environ.get("INPUT_PROVIDER") or "9router",
                  "model": os.environ.get("INPUT_MODEL") or "ag/gemini-4-hydrogen-xhigh",
                  "enable_api_server": os.environ.get("INPUT_API_SERVER") or "false",
                  "tunnel_provider": os.environ.get("INPUT_TUNNEL") or "auto",
                  "skip_browser": os.environ.get("INPUT_SKIP_BROWSER") or "true",
              },
          }))
          PY
          )
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/hermes.yml/dispatches" \
            -d "$PAYLOAD")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "Error: workflow_dispatch failed with HTTP $HTTP_CODE"
            cat /tmp/dispatch_resp.txt || true
            exit 1
          fi
          echo "Successfully dispatched next Hermes run on ref=$GH_REF."
